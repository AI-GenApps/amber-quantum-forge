<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Street Royale</title>
    <meta name="theme-color" content="#1b2a55" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link
      rel="preload"
      href="/fonts/russo-one/RussoOne-Regular.ttf"
      as="font"
      type="font/ttf"
      crossorigin
    />
    <link rel="preload" href="/fonts/saira/Saira.ttf" as="font" type="font/ttf" crossorigin />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0b1020;
      }
      #game {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
        outline: none;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="ui"></div>
    <noscript>
      <div
        role="alert"
        style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;background:#0b1020;color:#f5f7ff;font-family:Saira,sans-serif;text-align:center;font-size:1.1rem;line-height:1.45"
      >
        <p style="max-width:32rem;margin:0">
          This game needs JavaScript and WebGL2. Turn JavaScript on in your browser settings and reload
          this page.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
