openapi: 3.0.3
info:
  title: Starter Expo Mobile API
  version: 1.0.0
  description: API routes exposed by `apps/web` (`packages/api`).
servers:
  - url: https://your-domain.com/api
    description: Production API
security: []
paths:
  /:
    get:
      summary: API health check root
      operationId: getRoot
      responses:
        "200":
          description: Service status
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required:
                  - message
  /health:
    get:
      summary: Basic health check
      operationId: getHealth
      responses:
        "200":
          description: Health status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  timestamp:
                    type: string
                    format: date-time
                required:
                  - status
                  - timestamp
  /auth/register-device:
    post:
      summary: Register or update a device token for push
      operationId: registerDevice
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - fcmToken
              properties:
                fcmToken:
                  type: string
                  description: Firebase Cloud Messaging token
                deviceInfo:
                  type: object
                  additionalProperties: true
      responses:
        "200":
          description: Registration successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterDeviceResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/me:
    get:
      summary: Fetch current authenticated user
      operationId: getAuthMe
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/device/{fcmToken}:
    delete:
      summary: Remove a registered device token
      operationId: deleteDevice
      security:
        - bearerAuth: []
      parameters:
        - name: fcmToken
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Device removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Device not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/exchange:
    post:
      summary: Exchange Firebase ID token for API JWT and refresh token
      operationId: exchangeAuth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - idToken
              properties:
                idToken:
                  type: string
      responses:
        "200":
          description: Exchange successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokenPair"
        "400":
          description: Invalid body or token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized Firebase token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/refresh:
    post:
      summary: Rotate refresh token and issue a new API JWT
      operationId: refreshAuth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refreshToken
              properties:
                refreshToken:
                  type: string
      responses:
        "200":
          description: Refresh successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokenPair"
        "400":
          description: Invalid body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Invalid refresh token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/revoke:
    post:
      summary: Revoke one or all refresh tokens
      operationId: revokeAuth
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
      responses:
        "200":
          description: Revoke successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
  /ai/chat:
    post:
      summary: Stream chat completion
      operationId: aiChat
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - messages
              properties:
                messages:
                  type: array
                  maxItems: 50
                  minItems: 1
                  items:
                    $ref: "#/components/schemas/ChatMessage"
                system:
                  type: string
                model:
                  type: string
      responses:
        "200":
          description: SSE stream of model messages
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /chat/sync:
    post:
      summary: Sync local chat history
      operationId: syncChat
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - messages
              properties:
                messages:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: object
                    required:
                      - clientId
                      - role
                      - content
                      - createdAt
                    properties:
                      clientId:
                        type: string
                      role:
                        type: string
                        enum:
                          - user
                          - assistant
                      content:
                        type: string
                      createdAt:
                        type: string
                        format: date-time
      responses:
        "200":
          description: Sync summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  synced:
                    type: integer
                  skipped:
                    type: integer
                required:
                  - synced
                  - skipped
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /profile/upload-picture:
    post:
      summary: Upload profile picture
      operationId: uploadProfilePicture
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Upload successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  profilePictureUrl:
                    type: string
                    format: uri
                required:
                  - success
                  - profilePictureUrl
        "400":
          description: Invalid upload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /profile/picture:
    delete:
      summary: Delete profile picture
      operationId: deleteProfilePicture
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Delete successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No picture available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /config/app-metadata:
    get:
      summary: Read app metadata config
      operationId: getAppMetadata
      responses:
        "200":
          description: Current app metadata key/value map
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /config/{key}:
    put:
      summary: Update config key (admin only)
      operationId: updateConfig
      security:
        - bearerAuth: []
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - value
              properties:
                value:
                  description: JSON-serializable value for typed config keys
                  oneOf:
                    - type: string
                    - type: number
                    - type: boolean
                    - type: object
                    - type: array
      responses:
        "200":
          description: Update successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  key:
                    type: string
                  value:
                    type: object
                    additionalProperties: true
                required:
                  - success
                  - key
                  - value
        "400":
          description: Invalid body or unknown key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Use `Authorization: Bearer <token>`"
  schemas:
    ChatMessage:
      type: object
      required:
        - role
        - content
      properties:
        role:
          type: string
          enum:
            - user
            - assistant
            - system
        content:
          type: string
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          nullable: true
        name:
          type: string
        profilePictureUrl:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - email
        - name
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
        message:
          type: string
    SuccessResponse:
      type: object
      required:
        - success
      properties:
        success:
          type: boolean
        message:
          type: string
    RegisterDeviceResponse:
      type: object
      required:
        - success
        - user
      properties:
        success:
          type: boolean
        user:
          $ref: "#/components/schemas/User"
    AuthTokenPair:
      type: object
      required:
        - accessToken
        - refreshToken
        - expiresIn
        - tokenType
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: integer
        tokenType:
          type: string
        user:
          type: object
          properties:
            uid:
              type: string
            email:
              type: string
              nullable: true
            displayName:
              type: string
              nullable: true
            photoURL:
              type: string
              nullable: true
