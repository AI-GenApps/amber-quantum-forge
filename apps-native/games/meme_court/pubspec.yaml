name: meme_court
description: Meme Court Flutter client.
publish_to: none
resolution: workspace
version: 0.1.0+1

environment:
  sdk: ">=3.13.3 <4.0.0"
  flutter: ">=3.47.3"

dependencies:
  court_rules:
    path: ../packages/court_rules
  flutter:
    sdk: flutter
  path_provider: ^2.1.5
  platform_core:
    path: ../packages/platform_core

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/
  fonts:
    - family: Bangers
      fonts:
        - asset: assets/fonts/Bangers/Bangers-Regular.ttf
    - family: Lexend
      fonts:
        - asset: assets/fonts/Lexend/Lexend-Variable.ttf
