name: StarterKMP
options:
  minimumXcodeVersion: "16.0"
  deploymentTarget:
    iOS: "17.0"
  groupSortPosition: top
  swift: "6.0"
settings:
  base:
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  StarterKMP:
    type: application
    platform: iOS
    bundleIdPrefix: app.w3dev.starter
    sources: StarterKMP/
    settings:
      base:
        INFOPLIST_FILE: StarterKMP/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: app.w3dev.starter.kmp
        SWIFT_VERSION: "6.0"
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/../kmp/shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - '@executable_path/Frameworks'
      configs:
        Debug:
          API_BASE_URL: http://127.0.0.1:3000/api
        Release:
          API_BASE_URL: https://api.example.com/api
    dependencies:
      - framework: ../kmp/shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)/StarterShared.framework
        embed: true
    preBuildScripts:
      - name: Build StarterShared
        script: |
          cd "$SRCROOT/../kmp"
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
        basedOnDependencyAnalysis: false
        showEnvVarsInLog: false
