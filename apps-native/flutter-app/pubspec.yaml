name: flutter_app
description: Starter app — Flutter surface, a peer to apps-native/ios-app.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # Firebase / auth
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.3

  # Subscriptions
  purchases_flutter: ^8.2.1

  # Storage / networking
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2
  http: ^1.2.2
  url_launcher: ^6.3.1

  # State management
  flutter_riverpod: ^2.6.1

  # Feature packages — mirrors project.yml's `packages:` block in ios-app.
  starter_auth:
    path: ../../plugins/flutter/auth
  starter_ai:
    path: ../../plugins/flutter/ai
  starter_chat:
    path: ../../plugins/flutter/chat

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
