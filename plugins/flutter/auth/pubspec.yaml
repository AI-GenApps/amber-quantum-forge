name: starter_auth
description: >
  Two-stage Firebase + API JWT auth for the Flutter app. Mirrors
  plugins/ios/auth (StarterAuth).
version: 0.1.0
publish_to: "none"

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_auth: ^5.3.0
  firebase_core: ^3.6.0
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.3
  flutter_secure_storage: ^9.2.2
  http: ^1.2.2
  crypto: ^3.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
