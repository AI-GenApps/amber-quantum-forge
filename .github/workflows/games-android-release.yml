name: Gaming Android release artifact

on:
  workflow_dispatch:
    inputs:
      app:
        description: Game stable ID
        required: true
        type: choice
        options:
          - merge_relay
          - pocket_biome
          - sixty_second_heist
          - meme_court
          - snapquest
          - ludo

permissions:
  contents: read

env:
  BUN_VERSION: "1.3.3"
  FLUTTER_VERSION: "3.47.3"
  GAME_ENVIRONMENT: production

jobs:
  release:
    name: Android AAB ${{ inputs.app }}
    runs-on: ubuntu-latest
    environment:
      name: games-${{ inputs.app }}-release
    env:
      GAME_APP: ${{ inputs.app }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: "17"
      - uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - name: Validate release input
        shell: bash
        run: |
          set -euo pipefail
          case "$GAME_APP" in merge_relay|pocket_biome|sixty_second_heist|meme_court|snapquest|ludo) ;; *) echo "Invalid game app: $GAME_APP" >&2; exit 1 ;; esac
      - run: bun install --frozen-lockfile
      - name: Decode app keystore
        id: keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "NOT RUN: Android release keystore secret is not configured for this app environment." >&2
            exit 2
          fi
          keystore="$RUNNER_TEMP/${GAME_APP}.jks"
          trap 'rm -f -- "$keystore"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          test -s "$keystore"
          chmod 600 "$keystore"
          echo "path=$keystore" >> "$GITHUB_OUTPUT"
          trap - EXIT
      - run: |
          set -euo pipefail
          cd "apps-native/games/$GAME_APP"
          flutter pub get --enforce-lockfile
          flutter analyze
          flutter test
      - name: Build signed Android artifact
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          bun scripts/games/cli.ts build --app "$GAME_APP" --platform android --mode aab --environment "$GAME_ENVIRONMENT"
      - name: Write artifact metadata
        run: bun scripts/games/metadata.ts --app "$GAME_APP" --platform android --environment "$GAME_ENVIRONMENT" --output "apps-native/games/$GAME_APP/build/game-metadata.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: game-${{ inputs.app }}-android-production
          if-no-files-found: error
          path: |
            apps-native/games/${{ inputs.app }}/build/app/outputs/bundle/release/*.aab
            apps-native/games/${{ inputs.app }}/build/game-metadata.json
      - name: Remove temporary keystore
        if: always()
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${ANDROID_KEYSTORE_PATH:-}" ]; then
            rm -f -- "$ANDROID_KEYSTORE_PATH"
          fi
