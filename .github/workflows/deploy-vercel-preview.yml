# Preview deploy for apps/web on PRs. Skips PRs whose title starts with WIP.
# Required secret: VERCEL_TOKEN. The Vercel project controls its own root directory.
name: Deploy to Vercel - Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/deploy-vercel-preview.yml'
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to deploy'
        required: false
        type: string

concurrency:
  group: preview-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write
  pull-requests: write
  issues: write

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    if: >
      github.event_name != 'pull_request' ||
      (!startsWith(github.event.pull_request.title, 'WIP') &&
       !startsWith(github.event.pull_request.title, 'wip') &&
       !startsWith(github.event.pull_request.title, '[WIP]') &&
       !startsWith(github.event.pull_request.title, '[wip]'))
    environment:
      name: preview

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Deploy to Vercel
        uses: W3Dev/vercel-deploy@main
        with:
          vercel_token: ${{ secrets.VERCEL_TOKEN }}
          vercel_org_id: 'team_bhbVYR6BqVYMXKwAp7F1k5ib'
          vercel_project_id: 'prj_MaMno1fEzSLQoMHGsrGF3fV28ocH'
          package_manager: 'bun'
          node_version: '22'
          deploy_args: '--archive=tgz'
          alias_prefix: 'starter-expo-mobile'
          environment: 'preview'
