name: Gaming app build

on:
  workflow_call:
    inputs:
      app:
        required: true
        type: string
      platform:
        required: true
        type: string
      environment:
        required: true
        type: string
      mode:
        required: true
        type: string

permissions:
  contents: read

env:
  BUN_VERSION: "1.3.3"
  FLUTTER_VERSION: "3.47.3"
  XCODEGEN_VERSION: "2.44.1"
  XCODEGEN_SHA256: "a2e905fb68446e9bb4008cdfe2e13e3f176d0cbcca828b71770f8e53fca91b73"

jobs:
  android:
    if: inputs.platform == 'android'
    runs-on: ubuntu-latest
    env:
      GAME_APP: ${{ inputs.app }}
      GAME_PLATFORM: ${{ inputs.platform }}
      GAME_ENVIRONMENT: ${{ inputs.environment }}
      GAME_MODE: ${{ inputs.mode }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: "17"
      - uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Validate build inputs
        shell: bash
        run: |
          set -euo pipefail
          case "$GAME_APP" in merge_relay|pocket_biome|sixty_second_heist|meme_court|snapquest) ;; *) echo "Invalid game app: $GAME_APP" >&2; exit 1 ;; esac
          case "$GAME_PLATFORM" in android|ios) ;; *) echo "Invalid game platform: $GAME_PLATFORM" >&2; exit 1 ;; esac
          case "$GAME_ENVIRONMENT" in debug|staging|production) ;; *) echo "Invalid game environment: $GAME_ENVIRONMENT" >&2; exit 1 ;; esac
          case "$GAME_PLATFORM:$GAME_MODE" in android:debug|android:release|android:aab|ios:unsigned|ios:profile|ios:archive|ios:ipa) ;; *) echo "Invalid game build mode: $GAME_PLATFORM:$GAME_MODE" >&2; exit 1 ;; esac
      - run: |
          set -euo pipefail
          cd "apps-native/games/$GAME_APP"
          flutter pub get --enforce-lockfile
      - run: |
          set -euo pipefail
          cd "apps-native/games/$GAME_APP"
          flutter analyze
          flutter test
      - run: |
          set -euo pipefail
          bun scripts/games/cli.ts build --app "$GAME_APP" --platform "$GAME_PLATFORM" --mode "$GAME_MODE" --environment "$GAME_ENVIRONMENT"
      - name: Write artifact metadata
        run: bun scripts/games/metadata.ts --app "$GAME_APP" --platform "$GAME_PLATFORM" --environment "$GAME_ENVIRONMENT" --output "apps-native/games/$GAME_APP/build/game-metadata.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: game-${{ inputs.app }}-android-${{ inputs.environment }}
          if-no-files-found: error
          path: |
            apps-native/games/${{ inputs.app }}/build/app/outputs/flutter-apk/*.apk
            apps-native/games/${{ inputs.app }}/build/app/outputs/bundle/release/*.aab
            apps-native/games/${{ inputs.app }}/build/game-metadata.json

  ios:
    if: inputs.platform == 'ios'
    runs-on: macos-26
    env:
      GAME_APP: ${{ inputs.app }}
      GAME_PLATFORM: ${{ inputs.platform }}
      GAME_ENVIRONMENT: ${{ inputs.environment }}
      GAME_MODE: ${{ inputs.mode }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - name: Install XcodeGen
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/xcodegen-${XCODEGEN_VERSION}.zip"
          destination="$RUNNER_TEMP/xcodegen-${XCODEGEN_VERSION}"
          curl --fail --location --silent --show-error --retry 3 \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip" \
            --output "$archive"
          echo "${XCODEGEN_SHA256}  ${archive}" | shasum --algorithm 256 --check --status
          mkdir -p "$destination"
          unzip -q -o "$archive" -d "$destination"
          echo "$destination/xcodegen/bin" >> "$GITHUB_PATH"
          test "$("$destination/xcodegen/bin/xcodegen" --version | awk '{print $2}')" = "${XCODEGEN_VERSION}"
      - run: bun install --frozen-lockfile
      - name: Validate build inputs
        shell: bash
        run: |
          set -euo pipefail
          case "$GAME_APP" in merge_relay|pocket_biome|sixty_second_heist|meme_court|snapquest) ;; *) echo "Invalid game app: $GAME_APP" >&2; exit 1 ;; esac
          case "$GAME_PLATFORM" in android|ios) ;; *) echo "Invalid game platform: $GAME_PLATFORM" >&2; exit 1 ;; esac
          case "$GAME_ENVIRONMENT" in debug|staging|production) ;; *) echo "Invalid game environment: $GAME_ENVIRONMENT" >&2; exit 1 ;; esac
          case "$GAME_PLATFORM:$GAME_MODE" in android:debug|android:release|android:aab|ios:unsigned|ios:profile|ios:archive|ios:ipa) ;; *) echo "Invalid game build mode: $GAME_PLATFORM:$GAME_MODE" >&2; exit 1 ;; esac
      - run: bun scripts/games/cli.ts xcodegen --app "$GAME_APP"
      - run: |
          set -euo pipefail
          cd "apps-native/games/$GAME_APP"
          flutter pub get --enforce-lockfile
          flutter analyze
          flutter test
      - name: Verify bundle identity
        run: |
          set -euo pipefail
          cd "apps-native/games/$GAME_APP"
          debug_id="$(jq -r .debugId game.config.json)"
          production_id="$(jq -r .productionId game.config.json)"
          xcodebuild -project ios/Runner.xcodeproj -scheme Runner -showBuildSettings -configuration Debug | grep -F "PRODUCT_BUNDLE_IDENTIFIER = $debug_id"
          xcodebuild -project ios/Runner.xcodeproj -scheme Runner -showBuildSettings -configuration Release | grep -F "PRODUCT_BUNDLE_IDENTIFIER = $production_id"
      - run: |
          set -euo pipefail
          bun scripts/games/cli.ts build --app "$GAME_APP" --platform "$GAME_PLATFORM" --mode "$GAME_MODE" --environment "$GAME_ENVIRONMENT"
      - name: Write artifact metadata
        run: bun scripts/games/metadata.ts --app "$GAME_APP" --platform "$GAME_PLATFORM" --environment "$GAME_ENVIRONMENT" --output "apps-native/games/$GAME_APP/build/game-metadata.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: game-${{ inputs.app }}-ios-${{ inputs.environment }}
          if-no-files-found: error
          path: |
            apps-native/games/${{ inputs.app }}/build/ios/iphoneos/*.app
            apps-native/games/${{ inputs.app }}/build/ios/ipa/*.ipa
            apps-native/games/${{ inputs.app }}/build/game-metadata.json
